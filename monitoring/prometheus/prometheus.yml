global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: exchange-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: matching-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker", "worker2"]
        type: A
        port: 3001

  - job_name: market-simulator
    metrics_path: /metrics
    static_configs:
      - targets: ["simulator:3002"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
