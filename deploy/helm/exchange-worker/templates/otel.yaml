{{- if .Values.tracing.enabled }}
{{- $name := include "exchange-worker.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-exchange-worker-otel
  labels:
    {{- include "exchange-worker.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 127.0.0.1:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 96
        spike_limit_mib: 24
      batch:
        timeout: 2s
        send_batch_size: 256
        send_batch_max_size: 512
    exporters:
      otlp:
        endpoint: {{ .Values.tracing.endpoint }}
        tls:
          insecure: true
        sending_queue:
          queue_size: 32
        retry_on_failure:
          max_elapsed_time: 30s
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
{{- end }}
