{{- $name := include "exchange-worker.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "exchange-worker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 3001
      targetPort: metrics
  selector:
    {{- include "exchange-worker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "exchange-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "exchange-worker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "exchange-worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.tracing.enabled }}
      volumes:
        - name: otel-config
          configMap: {name: {{ $name }}-exchange-worker-otel}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "exchange-worker.applicationImage" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          ports:
            - name: metrics
              containerPort: 3001
          env:
            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:4318
            {{- end }}
            - name: RUST_LOG
              value: info
            - name: WORKER_METRICS_BIND
              value: 0.0.0.0:3001
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_COMMAND_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.kafka.consumerGroup | quote }}
            {{- end }}
            {{- include "exchange-worker.databaseEnv" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.tracing.enabled }}
        - name: otel-collector
          image: {{ .Values.tracing.collectorImage }}
          args: ["--config=/etc/otel/config.yaml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.tracing.resources | nindent 12 }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
        {{- end }}
