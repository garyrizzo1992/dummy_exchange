{{- if .Values.traders.enabled }}
{{- $name := include "exchange.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-trader
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 3003
      targetPort: metrics
  selector:
    {{- include "exchange.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: trader
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: {{ $name }}-trader
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
    app.kubernetes.io/component: trader
spec:
  {{- if not .Values.traders.autoscaling.enabled }}
  replicas: {{ .Values.traders.replicas }}
  {{- end }}
  serviceName: {{ $name }}-trader
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "exchange.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: trader
  template:
    metadata:
      labels:
        {{- include "exchange.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: trader
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "exchange.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: trader
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.tracing.enabled }}
      volumes:
        - name: otel-config
          configMap: {name: {{ $name }}-exchange-otel}
      {{- end }}
      containers:
        - name: trader
          image: {{ include "exchange.applicationImage" (dict "root" . "image" .Values.image) }}
          args: ["trader"]
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          ports:
            - name: metrics
              containerPort: 3003
          env:
            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:4318
            {{- end }}
            - name: RUST_LOG
              value: info
            - name: SIMULATOR_METRICS_BIND
              value: 0.0.0.0:3003
            - name: TRADER_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: TRADER_INTERVAL_MS
              value: {{ .Values.traders.intervalMs | quote }}
            - name: SIMULATION_SEED
              value: {{ .Values.simulationSeed | quote }}
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_COMMAND_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            {{- end }}
            {{- include "exchange.databaseEnv" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.traders.resources | nindent 12 }}

        {{- if .Values.tracing.enabled }}
        - name: otel-collector
          image: {{ .Values.tracing.collectorImage }}
          args: ["--config=/etc/otel/config.yaml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.tracing.resources | nindent 12 }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
        {{- end }}

{{- end }}
