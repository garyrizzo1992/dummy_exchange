# Settings owned by this chart. Keep the release name and resource prefix consistent.
nameOverride: dummy-exchange
fullnameOverride: ''
database:
  host: ''
  port: 5432
  name: dummy_exchange
  user: postgres
  sslMode: disable
  secret:
    name: dummy-exchange-secrets
    key: postgres-password
imageRegistry: docker.io/garyrizzo1992
imagePullPolicy: IfNotPresent
image:
  name: dummy-exchange-simulator
  tag: main
  digest: ''
simulationSeed: '42'
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Temporary environment overrides for migrations using older images.
extraEnv: []

tracing:
  enabled: false
  collectorImage: otel/opentelemetry-collector:0.147.0@sha256:b66294ff3a9eadc446ec4d0e78b6f4980c2a85b0ccc27f2cdc4641bd0fe401a7
  endpoint: dummy-exchange-dev-dummy-exchange-tempo:4317
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 250m, memory: 128Mi}

traders:
  enabled: true
  replicas: 10
  intervalMs: 2000
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
  autoscaling:
    enabled: false
    minReplicas: 5
    maxReplicas: 30
    intervalSeconds: 300

kafka:
  enabled: false
  bootstrapServers: exchange-kafka-kafka-bootstrap:9092
  topic: exchange.order-commands

priceSource: simulated
liquidityNotionalUsd: 100000
