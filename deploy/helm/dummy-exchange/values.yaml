nameOverride: ""
fullnameOverride: ""

# Replace this registry/namespace when your Docker Hub username differs from the GitHub owner.
imageRegistry: docker.io/garyrizzo1992
imagePullPolicy: IfNotPresent

existingSecret: dummy-exchange-secrets
secretKeys:
  postgresPassword: postgres-password
  jwtSecret: jwt-secret
  grafanaAdminPassword: grafana-admin-password

api:
  image:
    name: dummy-exchange-api
    tag: main
    digest: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  image:
    name: dummy-exchange-worker
    tag: main
    digest: ""
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

simulator:
  image:
    name: dummy-exchange-simulator
    tag: main
    digest: ""
  simulationSeed: "42"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

postgres:
  enabled: true
  image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
  database: dummy_exchange
  user: postgres
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

redis:
  enabled: true
  image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
  persistence:
    size: 1Gi
    storageClass: ""

monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    service:
      type: ClusterIP
      port: 9090
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    service:
      type: ClusterIP
      port: 3000
  postgresExporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
  redisExporter:
    image: oliver006/redis_exporter:v1.88.0@sha256:2c8c55c63ce4d915389f03d337b8acef56aaaca9fab8728291287e612d4d6398
