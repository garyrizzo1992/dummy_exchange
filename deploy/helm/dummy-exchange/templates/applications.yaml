---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-simulator
  labels:
    {{- include "dummy-exchange.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: 3002
      targetPort: metrics
  selector:
    {{- include "dummy-exchange.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-simulator
  labels:
    {{- include "dummy-exchange.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dummy-exchange.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: simulator
  template:
    metadata:
      labels:
        {{- include "dummy-exchange.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: simulator
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: simulator
          image: {{ include "dummy-exchange.applicationImage" (dict "root" . "image" .Values.simulator.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          ports:
            - name: metrics
              containerPort: 3002
          env:
            - name: RUST_LOG
              value: info
            - name: SIMULATOR_METRICS_BIND
              value: 0.0.0.0:3002
            - name: SIMULATION_SEED
              value: {{ .Values.simulator.simulationSeed | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.postgresPassword }}
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ $name }}-postgres:5432/{{ .Values.postgres.database }}
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
