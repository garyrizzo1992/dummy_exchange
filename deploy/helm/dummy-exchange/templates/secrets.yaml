{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "dummy-exchange.fullname" . }}-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    oracle:
      vault: {{ required "externalSecrets.vaultId is required" .Values.externalSecrets.vaultId | quote }}
      region: {{ .Values.externalSecrets.region | quote }}
      principalType: InstancePrincipal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dummy-exchange.fullname" . }}-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ include "dummy-exchange.fullname" . }}-vault
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secretKeys.postgresPassword }}
      remoteRef:
        key: {{ required "externalSecrets.postgresSecretId is required" .Values.externalSecrets.postgresSecretId | quote }}
    - secretKey: {{ .Values.secretKeys.jwtSecret }}
      remoteRef:
        key: {{ required "externalSecrets.jwtSecretId is required" .Values.externalSecrets.jwtSecretId | quote }}
    - secretKey: {{ .Values.secretKeys.grafanaAdminPassword }}
      remoteRef:
        key: {{ required "externalSecrets.grafanaSecretId is required" .Values.externalSecrets.grafanaSecretId | quote }}
{{- end }}
