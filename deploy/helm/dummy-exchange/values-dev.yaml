# This file is the desired state for the OCI development cluster. The image
# digests are replaced by the GitHub Actions promotion workflow after an image
# is successfully built and tested.
imagePullPolicy: IfNotPresent
api:
  image:
    tag: main
    digest: "sha256:982bf17ce5c6af438b48f20b593ae3979a6cb841cdd77297d68d16edddf50202"
worker:
  image:
    tag: main
    digest: "sha256:f5121026e9341a2cb366c78caddf500f31f5b4489ae16dea7e1ccf9e2d4f1319"
simulator:
  image:
    tag: main
    digest: "sha256:148cbce3d03b5a109197439535a4be6703b70ff452623d57fd4dfdae16269959"
imageRegistry: docker.io/garyrizzo1992
# Only identifiers are committed. Values are stored in OCI Vault.
externalSecrets:
  enabled: true
  vaultId: ocid1.vault.oc1.eu-milan-1.hjvl5nnyaadq2.abwgsljrhqsvxa5k42ihwackhwkndppsmgeakyk2gzdi6j2i7d462npsxlmq
  postgresSecretName: dummy-exchange-dev-postgres-password
  jwtSecretName: dummy-exchange-dev-jwt-secret
  grafanaSecretName: dummy-exchange-dev-grafana-admin-password
# Development data stays on the worker VM disk. Use durable CSI volumes and
# backups before promoting this environment to production.
postgres:
  persistence:
    storageClass: local-path
redis:
  persistence:
    storageClass: local-path
monitoring:
  prometheus:
    persistence:
      storageClass: local-path
