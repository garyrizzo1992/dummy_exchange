{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "exchange-postgres.fullname" . }}-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    oracle:
      vault: {{ required "externalSecrets.vaultId is required" .Values.externalSecrets.vaultId | quote }}
      region: {{ .Values.externalSecrets.region | quote }}
      principalType: InstancePrincipal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "exchange-postgres.fullname" . }}-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ include "exchange-postgres.fullname" . }}-vault
  target:
    name: {{ .Values.database.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.database.secret.key }}
      remoteRef:
        key: {{ required "externalSecrets.secretName is required" .Values.externalSecrets.secretName | quote }}
    {{- range $key, $remote := .Values.externalSecrets.legacyKeys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $remote | quote }}
    {{- end }}
{{- end }}

{{- if and .Values.externalSecrets.enabled .Values.runtimeRole.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "exchange-postgres.fullname" . }}-runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ include "exchange-postgres.fullname" . }}-vault
  target:
    name: {{ .Values.runtimeRole.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.runtimeRole.secret.key }}
      remoteRef:
        key: {{ required "runtimeRole.vaultSecretName is required" .Values.runtimeRole.vaultSecretName | quote }}
{{- end }}

{{- if and .Values.externalSecrets.enabled .Values.runtimeRole.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "exchange-postgres.fullname" . }}-monitor-postgres-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ include "exchange-postgres.fullname" . }}-vault
  target:
    name: {{ .Values.runtimeRole.monitorSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.runtimeRole.monitorSecret.key }}
      remoteRef:
        key: {{ required "runtimeRole.monitorVaultSecretName is required" .Values.runtimeRole.monitorVaultSecretName | quote }}
{{- end }}
