# Settings owned by this chart. Keep the release name and resource prefix consistent.
nameOverride: dummy-exchange
fullnameOverride: ''
database:
  host: ''
  port: 5432
  name: dummy_exchange
  user: postgres
  sslMode: disable
  secret:
    name: dummy-exchange-secrets
    key: postgres-password
imageRegistry: docker.io/garyrizzo1992
imagePullPolicy: IfNotPresent
image:
  name: dummy-exchange-api
  tag: main
  digest: ''
replicas: 1
service:
  type: ClusterIP
  port: 3000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
migrations:
  enabled: true
  # Override user and secret here before switching runtime credentials.
  database: {}
  # Migration-only overrides; runtime extraEnv is never inherited.
  extraEnv: []
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
jwtSecret:
  name: dummy-exchange-api-secrets
  key: jwt-secret
externalSecrets:
  enabled: false
  region: eu-milan-1
  vaultId: ''
  secretName: ''

# Temporary environment overrides for migrations using older images.
extraEnv: []

tracing:
  enabled: false
  collectorImage: otel/opentelemetry-collector:0.147.0@sha256:b66294ff3a9eadc446ec4d0e78b6f4980c2a85b0ccc27f2cdc4641bd0fe401a7
  endpoint: dummy-exchange-dev-dummy-exchange-tempo:4317
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 250m, memory: 128Mi}

trustCloudflare: false
corsAllowedOrigins: []

networkPolicy:
  enabled: true
