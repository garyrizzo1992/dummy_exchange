{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "exchange-api.fullname" . }}-api
  labels:
    {{- include "exchange-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "exchange-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudflared}
        - podSelector:
            matchLabels:
              {{- include "exchange-api.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: trader
        - podSelector:
            matchLabels:
              {{- include "exchange-api.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: prometheus
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: exchange-ops}
      ports: [{protocol: TCP, port: 3000}]
{{- end }}
