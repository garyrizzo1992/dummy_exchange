{{- if .Values.migrations.enabled }}
{{- $name := include "exchange-api.fullname" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels:
    {{- include "exchange-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "exchange-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: {{ include "exchange-api.applicationImage" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          env:
            {{- include "exchange-api.databaseEnv" (dict "Values" (mergeOverwrite (deepCopy .Values) (dict "database" (mergeOverwrite (deepCopy .Values.database) .Values.migrations.database) "extraEnv" (.Values.migrations.extraEnv | default list))) "Release" .Release "Chart" .Chart) | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
