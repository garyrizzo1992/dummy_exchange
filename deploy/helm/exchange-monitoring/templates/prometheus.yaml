{{- if .Values.enabled }}
{{- $name := include "exchange-monitoring.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-prometheus
  labels:
    {{- include "exchange-monitoring.labels" . | nindent 4 }}
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      {{- with .Values.prometheus.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "exchange-monitoring.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-prometheus
  labels:
    {{- include "exchange-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "exchange-monitoring.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum }}
      labels:
        {{- include "exchange-monitoring.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      {{- if .Values.kubernetes.enabled }}
      serviceAccountName: {{ $name }}-prometheus
      {{- end }}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retentionTime }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap: { name: {{ $name }}-prometheus }
        - name: data
          {{- if .Values.prometheus.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ $name }}-prometheus }
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.prometheus.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: {{ $name }}-prometheus
  labels:
    {{- include "exchange-monitoring.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.prometheus.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
{{- end }}
{{- end }}
