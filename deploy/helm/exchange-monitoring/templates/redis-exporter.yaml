{{- if and .Values.enabled .Values.redisExporter.enabled }}
{{- $name := include "exchange-monitoring.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-redis-exporter
  labels:
    {{- include "exchange-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "exchange-monitoring.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-exporter
  template:
    metadata:
      labels:
        {{- include "exchange-monitoring.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: {{ .Values.redisExporter.image }}
          resources:
            {{- toYaml .Values.redisExporter.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://{{ $name }}-redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-redis-exporter
  labels:
    {{- include "exchange-monitoring.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
  selector:
    {{- include "exchange-monitoring.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
{{- end }}
