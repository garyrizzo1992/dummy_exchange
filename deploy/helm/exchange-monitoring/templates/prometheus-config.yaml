{{- if .Values.enabled }}
{{- $name := include "exchange-monitoring.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-prometheus
  labels:
    {{- include "exchange-monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: exchange-api
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ $name }}-api:3000"]
      - job_name: matching-worker
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["{{ $name }}-worker"]
            type: A
            port: 3001
      - job_name: market-simulator
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ $name }}-simulator:3002"]
      {{- if .Values.postgresExporter.enabled }}
      - job_name: postgres
        static_configs:
          - targets: ["{{ $name }}-postgres-exporter:9187"]
      {{- end }}
      {{- if .Values.redisExporter.enabled }}
      - job_name: redis
        static_configs:
          - targets: ["{{ $name }}-redis-exporter:9121"]
      {{- end }}
  alerts.yml: |
    groups:
      - name: exchange-availability
        rules:
          - alert: ExchangeApiUnavailable
            expr: up{job="exchange-api"} == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: Exchange API scrape target is unavailable }
          {{- if .Values.postgresExporter.enabled }}
          - alert: PostgreSQLUnavailable
            expr: pg_up == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: PostgreSQL exporter cannot connect to the exchange database }
          {{- end }}
          {{- if .Values.redisExporter.enabled }}
          - alert: RedisUnavailable
            expr: redis_up == 0
            for: 5m
            labels: { severity: warning }
            annotations: { summary: Redis exporter cannot reach Redis }
          {{- end }}
          - alert: ElevatedApiErrorRate
            expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations: { summary: More than 5 percent of API requests are failing with 5xx responses }
{{- end }}
