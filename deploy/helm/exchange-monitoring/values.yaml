# Settings owned by this chart. Keep the release name and resource prefix consistent.
nameOverride: dummy-exchange
fullnameOverride: ''
database:
  host: ''
  port: 5432
  name: dummy_exchange
  user: postgres
  sslMode: disable
  secret:
    name: dummy-exchange-secrets
    key: postgres-password
enabled: true
prometheus:
  retentionTime: 15d
  retentionSize: 4GB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
  service:
    type: ClusterIP
    port: 9090
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ''
grafana:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
  service:
    type: ClusterIP
    port: 3000
  adminSecret:
    name: dummy-exchange-monitoring-secrets
    key: grafana-admin-password
