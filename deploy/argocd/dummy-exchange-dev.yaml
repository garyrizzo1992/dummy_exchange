# Keep the running release compatible while CI promotes the new images.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-exchange-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: dummy-exchange-dev-dummy-exchange-worker
    jsonPointers: [/spec/replicas]
  - group: apps
    kind: StatefulSet
    name: dummy-exchange-dev-dummy-exchange-trader
    jsonPointers: [/spec/replicas]
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: dummy-exchange
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  sources:
  - repoURL: https://github.com/garyrizzo1992/dummy_exchange.git
    targetRevision: main
    path: deploy/helm/exchange-api
    helm:
      releaseName: dummy-exchange-dev
      valueFiles:
      - values.yaml
      - values-dev.yaml
      valuesObject:
        extraEnv:
        - name: DATABASE_URL
          value: postgresql://exchange_app:$(PGPASSWORD)@dummy-exchange-dev-dummy-exchange-postgres:5432/dummy_exchange?sslmode=disable
  - repoURL: https://github.com/garyrizzo1992/dummy_exchange.git
    targetRevision: main
    path: deploy/helm/exchange-worker
    helm:
      releaseName: dummy-exchange-dev
      valueFiles:
      - values.yaml
      - values-dev.yaml
      valuesObject:
        extraEnv:
        - name: DATABASE_URL
          value: postgresql://exchange_app:$(PGPASSWORD)@dummy-exchange-dev-dummy-exchange-postgres:5432/dummy_exchange?sslmode=disable
  - repoURL: https://github.com/garyrizzo1992/dummy_exchange.git
    targetRevision: main
    path: deploy/helm/exchange
    helm:
      releaseName: dummy-exchange-dev
      valueFiles:
      - values.yaml
      - values-dev.yaml
      valuesObject:
        extraEnv:
        - name: DATABASE_URL
          value: postgresql://exchange_app:$(PGPASSWORD)@dummy-exchange-dev-dummy-exchange-postgres:5432/dummy_exchange?sslmode=disable
