apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-exchange-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/garyrizzo1992/dummy_exchange.git
    targetRevision: main
    path: deploy/helm/dummy-exchange
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dummy-exchange
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
