apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-dev
  namespace: argocd
spec:
  project: default
  destination: {server: 'https://kubernetes.default.svc', namespace: keda}
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
    helm:
      valuesObject:
        resources:
          operator:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          metricServer:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          webhooks:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  # Kubernetes drops this empty map from the upstream Strimzi CRD schema.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jsonPointers:
        - /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties
  project: default
  destination: {server: 'https://kubernetes.default.svc', namespace: kafka-system}
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      valuesObject:
        watchNamespaces: [dummy-exchange]
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {cpu: 500m, memory: 512Mi}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
