---
- name: Prepare Kubernetes nodes
  hosts: control_plane:workers
  gather_facts: true
  become: true
  tasks:
    # Kubernetes requires swap to be disabled unless the kubelet is explicitly
    # configured to support it:
    # https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/#swap-configuration
    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    # Keep swap disabled after a reboot. See the swap guidance above.
    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+\S+\s+swap\s+'
        state: absent

    # br_netfilter lets iptables see bridged traffic. Kubernetes documents this
    # prerequisite here:
    # https://kubernetes.io/docs/setup/production-environment/container-runtimes/#install-and-configure-prerequisites
    - name: Configure Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        content: |
          br_netfilter
        mode: '0644'

    # Load the module now; the preceding file makes it persist after reboot.
    - name: Load the br_netfilter module
      ansible.builtin.command: modprobe br_netfilter
      changed_when: false

    # Enable IPv4 forwarding and make bridged traffic visible to iptables:
    # https://kubernetes.io/docs/setup/production-environment/container-runtimes/#install-and-configure-prerequisites
    - name: Configure Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
        mode: '0644'

    # Apply the Kubernetes networking settings immediately.
    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    # The official kubeadm RPM repository and package installation instructions:
    # https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/
    - name: Configure the Kubernetes package repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.37/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.37/rpm/repodata/repomd.xml.key
        exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

    # Install kubeadm, kubelet, kubectl, and the container runtime.
    - name: Install Kubernetes packages
      ansible.builtin.dnf:
        name:
          - containerd
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    # Kubernetes requires a CRI-compatible runtime. This generates containerd's
    # default configuration before changing its cgroup driver:
    # https://kubernetes.io/docs/setup/production-environment/container-runtimes/#containerd-systemd
    - name: Generate the containerd configuration
      ansible.builtin.command: containerd config default
      register: containerd_config
      changed_when: false

    # kubeadm recommends matching the kubelet and container runtime cgroup drivers.
    # This configures containerd to use systemd:
    # https://kubernetes.io/docs/setup/production-environment/container-runtimes/#containerd-systemd
    - name: Configure containerd to use systemd cgroups
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
        mode: '0644'
      notify: Restart containerd

    # Start the CRI runtime and kubelet now, and after future reboots:
    # https://kubernetes.io/docs/setup/production-environment/container-runtimes/
    - name: Enable Kubernetes services
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - containerd
        - kubelet
  handlers:
    # Restart containerd so its changed cgroup configuration takes effect.
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

- name: Configure the control plane
  hosts: control_plane
  become: true
  roles:
    # Runs `kubeadm init` and records the worker join command:
    # https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
    - control_plane

- name: Configure the worker
  hosts: workers
  become: true
  vars:
    kubeadm_join_command: "{{ hostvars[groups['control_plane'][0]].kubeadm_join_command }}"
  roles:
    # Uses the control plane's join command on the worker:
    # https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/#join-nodes
    - worker

- name: Install Kubernetes networking and GitOps
  hosts: control_plane
  become: true
  roles:
    - cluster_addons
