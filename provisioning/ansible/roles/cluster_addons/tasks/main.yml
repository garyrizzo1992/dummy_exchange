---
# Calico supplies the Kubernetes pod network. It is pinned rather than fetched
# from a moving branch: https://docs.tigera.io/calico/latest/getting-started/kubernetes/quickstart
- name: Check whether Calico is installed
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get daemonset calico-node -n kube-system
  register: calico
  changed_when: false
  failed_when: false

- name: Install Calico
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml
  when: calico.rc != 0

- name: Wait for all Kubernetes nodes to become ready
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=10m
  changed_when: false

# Development volumes use the existing VM disk:
# https://github.com/rancher/local-path-provisioner
- name: Check whether development storage is installed
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get storageclass local-path
  register: local_storage
  changed_when: false
  failed_when: false

- name: Install development storage
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml
  when: local_storage.rc != 0

# Keep existing StorageClass, ConfigMap paths and PVCs unchanged on upgrades.
- name: Upgrade the existing storage provisioner
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf set image deployment/local-path-provisioner -n local-path-storage local-path-provisioner=docker.io/rancher/local-path-provisioner:v0.0.36
  when: local_storage.rc == 0

- name: Wait for the storage provisioner
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf rollout status deployment/local-path-provisioner -n local-path-storage --timeout=5m
  changed_when: false

- name: Select the Helm binary architecture
  ansible.builtin.set_fact:
    helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"

- name: Download Helm
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v3.22.0-linux-{{ helm_arch }}.tar.gz
    dest: /tmp/helm-v3.22.0-linux-{{ helm_arch }}.tar.gz
    checksum: sha256:https://get.helm.sh/helm-v3.22.0-linux-{{ helm_arch }}.tar.gz.sha256sum
    mode: '0644'

- name: Extract Helm
  ansible.builtin.unarchive:
    src: /tmp/helm-v3.22.0-linux-{{ helm_arch }}.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1]

- name: Configure the External Secrets Helm repository
  ansible.builtin.command: /usr/local/bin/helm repo add external-secrets https://charts.external-secrets.io --force-update
  changed_when: false

- name: Install External Secrets on the worker
  ansible.builtin.command:
    argv:
      - /usr/local/bin/helm
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - upgrade
      - --install
      - external-secrets
      - external-secrets/external-secrets
      - --version
      - 2.11.0
      - --namespace
      - external-secrets
      - --create-namespace
      - --set-string
      - "nodeSelector.kubernetes\\.io/hostname={{ hostvars[groups['workers'][0]].ansible_facts.hostname }}"
      - --wait
      - --timeout
      - 5m

# Pinned Argo CD bootstrap manifest:
# https://argo-cd.readthedocs.io/en/stable/getting_started/
- name: Check whether the Argo CD namespace exists
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get namespace argocd
  register: argocd_namespace
  changed_when: false
  failed_when: false

- name: Create the Argo CD namespace
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf create namespace argocd
  when: argocd_namespace.rc != 0

- name: Install Argo CD
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
  changed_when: false

- name: Wait for Argo CD
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf rollout status deployment/argocd-server -n argocd --timeout=10m
  changed_when: false

- name: Check whether the application namespace exists
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get namespace dummy-exchange
  register: application_namespace
  changed_when: false
  failed_when: false

- name: Create the application namespace
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf create namespace dummy-exchange
  when: application_namespace.rc != 0

- name: Configure Argo CD to wait for Vault secrets before deploying PostgreSQL
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - patch
      - configmap
      - argocd-cm
      - -n
      - argocd
      - --type=merge
      - -p
      - >-
        {{ {'data': {'application.resourceTrackingMethod': 'annotation', 'resource.customizations.health.external-secrets.io_ExternalSecret':
        'hs = {status = "Progressing", message = "Waiting for Vault secret"}; if obj.status ~= nil and obj.status.conditions ~= nil then for _, c in ipairs(obj.status.conditions) do if c.type == "Ready" and c.status == "True" then hs.status = "Healthy"; hs.message = "Secret synchronized" end end end; return hs'}} | to_json }}
  changed_when: false

# Bootstrap new clusters directly; existing releases require the staged transfer.
- name: Inspect any existing business application
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get application dummy-exchange-dev -n argocd -o json --ignore-not-found
  register: existing_exchange_application
  changed_when: false

- name: Require ownership transfer before reprovisioning a legacy application
  ansible.builtin.assert:
    that:
      - existing_exchange_application.stdout | trim == '' or ((existing_exchange_application.stdout | from_json).spec.sources | default([]) | map(attribute='path') | list | sort == ['deploy/helm/exchange', 'deploy/helm/exchange-api', 'deploy/helm/exchange-worker'])
    fail_msg: "Transfer the existing release following deploy/helm/README.md before reprovisioning. PostgreSQL must have independent ownership before business pruning resumes."

- name: Inspect workloads that require a single-pod rollout
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, get, deployment, "{{ item }}", -n, dummy-exchange, -o, json, --ignore-not-found]
  loop:
    - dummy-exchange-dev-dummy-exchange-prometheus
    - dummy-exchange-dev-dummy-exchange-simulator
  register: single_pod_workloads
  changed_when: false

- name: Clear legacy rolling-update settings before adopting Recreate
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - patch
      - deployment
      - "{{ item.item }}"
      - -n
      - dummy-exchange
      - --type=json
      - -p
      - '[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]'
  loop: "{{ single_pod_workloads.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stdout | trim | length > 0
    - (item.stdout | from_json).spec.strategy.type != 'Recreate' or (item.stdout | from_json).spec.strategy.rollingUpdate is defined

- name: Copy Kafka and KEDA operator application manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/argocd/keda-dev.yaml"
    dest: /tmp/exchange-keda-dev.yaml
    mode: '0644'

- name: Apply Kafka and KEDA operators
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/exchange-keda-dev.yaml

- name: Wait for Kafka and KEDA operators
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - -n
      - argocd
      - "application/{{ item }}"
      - --for=jsonpath={.status.health.status}=Healthy
      - --timeout=10m
  loop: [keda-dev, strimzi-dev]
  changed_when: false

- name: Wait for Kafka and KEDA custom resource definitions
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - "crd/{{ item }}"
      - --for=condition=Established
      - --timeout=5m
  loop: [kafkas.kafka.strimzi.io, kafkanodepools.kafka.strimzi.io, scaledobjects.keda.sh]
  changed_when: false

- name: Copy infrastructure application manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/argocd/{{ item }}-dev.yaml"
    dest: "/tmp/exchange-{{ item }}-dev.yaml"
    mode: '0644'
  loop: [postgres, monitoring, kafka]

- name: Apply infrastructure applications
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/exchange-{{ item }}-dev.yaml"
  loop: [postgres, monitoring, kafka]

- name: Wait for three Kafka brokers before enabling command producers
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf wait -n dummy-exchange kafka/exchange-kafka --for=condition=Ready --timeout=10m
  register: kafka_ready
  retries: 3
  delay: 20
  until: kafka_ready.rc == 0
  changed_when: false

- name: Wait for the data application to finish syncing
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - -n
      - argocd
      - application/dummy-exchange-data-dev
      - --for=jsonpath={.status.sync.status}=Synced
      - --timeout=10m
  changed_when: false

- name: Wait for database infrastructure before application migrations
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - -n
      - argocd
      - application/dummy-exchange-data-dev
      - --for=jsonpath={.status.health.status}=Healthy
      - --timeout=10m
  changed_when: false

- name: Wait for monitoring ownership before enabling business pruning
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - -n
      - argocd
      - application/dummy-exchange-observability-dev
      - "--for=jsonpath={.status.{{ item }}}={{ 'Synced' if item == 'sync.status' else 'Healthy' }}"
      - --timeout=10m
  loop: [sync.status, health.status]
  changed_when: false

- name: Copy the Argo CD development application
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/argocd/dummy-exchange-dev.yaml"
    dest: /tmp/dummy-exchange-dev.yaml
    mode: '0644'

- name: Apply the Argo CD development application
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/dummy-exchange-dev.yaml

- name: Configure public access through the free Cloudflare Tunnel
  ansible.builtin.include_tasks: cloudflare.yml
  when: cloudflare_enabled | default(false) | bool

- name: Copy exchange admission safeguards
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/security/admission.yaml"
    dest: /tmp/exchange-admission.yaml
    mode: '0644'

- name: Apply exchange admission safeguards
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/exchange-admission.yaml
