---
# Calico supplies the Kubernetes pod network. It is pinned rather than fetched
# from a moving branch: https://docs.tigera.io/calico/latest/getting-started/kubernetes/quickstart
- name: Check whether Calico is installed
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get daemonset calico-node -n kube-system
  register: calico
  changed_when: false
  failed_when: false

- name: Install Calico
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml
  when: calico.rc != 0

- name: Wait for all Kubernetes nodes to become ready
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=10m
  changed_when: false

# Development volumes use the existing VM disk:
# https://github.com/rancher/local-path-provisioner
- name: Check whether development storage is installed
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get storageclass local-path
  register: local_storage
  changed_when: false
  failed_when: false

- name: Install development storage
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.32/deploy/local-path-storage.yaml
  when: local_storage.rc != 0

- name: Wait for the storage provisioner
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf rollout status deployment/local-path-provisioner -n local-path-storage --timeout=5m
  changed_when: false

- name: Download Helm
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
    dest: /tmp/helm-v3.17.3-linux-amd64.tar.gz
    checksum: sha256:https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
    mode: '0644'

- name: Extract Helm
  ansible.builtin.unarchive:
    src: /tmp/helm-v3.17.3-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: /usr/local/bin/helm

- name: Configure the External Secrets Helm repository
  ansible.builtin.command: /usr/local/bin/helm repo add external-secrets https://charts.external-secrets.io --force-update
  changed_when: false

- name: Install External Secrets on the worker
  ansible.builtin.command:
    argv:
      - /usr/local/bin/helm
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - upgrade
      - --install
      - external-secrets
      - external-secrets/external-secrets
      - --version
      - 2.11.0
      - --namespace
      - external-secrets
      - --create-namespace
      - --set-string
      - "nodeSelector.kubernetes\\.io/hostname={{ hostvars[groups['workers'][0]].ansible_facts.hostname }}"
      - --wait
      - --timeout
      - 5m

# Pinned Argo CD bootstrap manifest:
# https://argo-cd.readthedocs.io/en/stable/getting_started/
- name: Check whether the Argo CD namespace exists
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get namespace argocd
  register: argocd_namespace
  changed_when: false
  failed_when: false

- name: Create the Argo CD namespace
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf create namespace argocd
  when: argocd_namespace.rc != 0

- name: Install Argo CD
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
  changed_when: false

- name: Wait for Argo CD
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf rollout status deployment/argocd-server -n argocd --timeout=10m
  changed_when: false

- name: Check whether the application namespace exists
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get namespace dummy-exchange
  register: application_namespace
  changed_when: false
  failed_when: false

- name: Create the application namespace
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf create namespace dummy-exchange
  when: application_namespace.rc != 0

- name: Configure Argo CD to wait for Vault secrets before deploying PostgreSQL
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - patch
      - configmap
      - argocd-cm
      - -n
      - argocd
      - --type=merge
      - -p
      - >-
        {{ {'data': {'resource.customizations.health.external-secrets.io_ExternalSecret':
        'hs = {status = "Progressing", message = "Waiting for Vault secret"}; if obj.status ~= nil and obj.status.conditions ~= nil then for _, c in ipairs(obj.status.conditions) do if c.type == "Ready" and c.status == "True" then hs.status = "Healthy"; hs.message = "Secret synchronized" end end end; return hs'}} | to_json }}
  changed_when: false

- name: Copy the Argo CD development application
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/argocd/dummy-exchange-dev.yaml"
    dest: /tmp/dummy-exchange-dev.yaml
    mode: '0644'

- name: Apply the Argo CD development application
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/dummy-exchange-dev.yaml
