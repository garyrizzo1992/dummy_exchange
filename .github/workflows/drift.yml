name: Check infrastructure drift

on:
  schedule:
    - cron: '17 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  drift:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, oci-dev]
    environment: dev
    defaults:
      run:
        working-directory: provisioning/terraform
    env:
      TF_VAR_tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
      TF_VAR_oci_auth: InstancePrincipal
      OCI_auth: InstancePrincipal
      TF_VAR_bastion_client_cidrs: ${{ vars.BASTION_CLIENT_CIDRS }}
      TF_VAR_image_ocid: ${{ vars.OCI_IMAGE_OCID }}
      TF_VAR_ssh_authorized_keys: ${{ secrets.CI_SSH_PUBLIC_KEY }}
      TF_VAR_ansible_runner: linux
      TF_VAR_ansible_wsl_directory: ${{ github.workspace }}/provisioning/ansible
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform init
      - name: Fail when drift is detected
        run: |
          set +e
          terraform plan -detailed-exitcode -var-file=envs/dev.tfvars -parallelism=1 -no-color
          result=$?
          test "$result" -eq 0
