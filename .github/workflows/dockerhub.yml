name: Test and publish Docker images

# Pull requests run tests and build all three images without publishing them.
# Pushes to main and version tags run the same checks, then publish to Docker Hub.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io

jobs:
  test:
    name: 1. Test code and Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Set up Helm 3.17.3
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Compile release binaries
        run: cargo build --workspace --release --locked

      - name: Validate Helm chart
        run: helm lint deploy/helm/dummy-exchange

      - name: Validate Minikube configuration
        run: helm template exchange deploy/helm/dummy-exchange --values deploy/helm/dummy-exchange/values-minikube.yaml > /dev/null

  images:
    name: 2. Build Docker image - ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_NAMESPACE: ${{ github.event_name == 'pull_request' && 'local' || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: crates/api/Dockerfile
          - service: worker
            dockerfile: crates/worker/Dockerfile
          - service: simulator
            dockerfile: crates/simulator/Dockerfile
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME repository secret."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN repository secret."; exit 1; }

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Docker image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/dummy-exchange-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and publish when allowed
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
