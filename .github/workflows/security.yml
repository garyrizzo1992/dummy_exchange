name: Security checks

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanners
        run: python3 scripts/install-security-tools.py --directory "$RUNNER_TEMP/security-tools"
      - name: Check action pins
        run: python3 scripts/check-workflow-security.py
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290 # 1.98.1
      - name: Verify the unused-RSA exception remains applicable
        run: |
          cargo tree --locked --target all -i rsa > "$RUNNER_TEMP/rsa-tree.txt"
          test ! -s "$RUNNER_TEMP/rsa-tree.txt"
      - name: Scan Git history for secrets
        run: '"$RUNNER_TEMP/security-tools/gitleaks" git --redact --no-banner .'
      - name: Scan locked dependencies
        run: '"$RUNNER_TEMP/security-tools/trivy" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml --skip-dirs target --skip-dirs .git --skip-dirs provisioning/terraform/.terraform --skip-dirs .wrangler .'
