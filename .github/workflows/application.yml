# Check the apps and Helm chart. Pull requests only test and build images.
# On main, publish the images and update their versions in Git.
# Argo CD then picks up the change and deploys it to dev.
name: Test, publish, and deploy applications

# Check pull requests. Publish images and update dev only from main.
on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - deploy/helm/**
      - deploy/ingress/**
      - scripts/check-helm.py
      - scripts/requirements-helm.txt
      - .github/workflows/application.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - deploy/helm/**
      - deploy/ingress/**
      - scripts/check-helm.py
      - scripts/requirements-helm.txt
      # The bot updates this file after publishing. Don't start another build.
      - '!deploy/helm/exchange-api/values-dev.yaml'
      - '!deploy/helm/exchange-worker/values-dev.yaml'
      - '!deploy/helm/exchange/values-dev.yaml'
      - .github/workflows/application.yml
  workflow_dispatch: # Also lets us start a run from the Actions tab.

# Jobs can read the repo. Only the promotion job below can write to it.
permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  # Keep the latest run for each branch or pull request.
  cancel-in-progress: true

jobs:
  # Check the Rust code and Helm chart before building images.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-helm.txt
      - name: Install Kubernetes manifest validator
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: python scripts/check-helm.py

  # For pull requests, build all three images in parallel without uploading them.
  verify-images:
    if: github.event_name == 'pull_request'
    needs: test
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: crates/api/Dockerfile
          - dockerfile: crates/worker/Dockerfile
          - dockerfile: crates/simulator/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false

  # After tests pass on main, upload the images to Docker Hub.
  publish-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Pass the exact image versions to the promotion job.
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      simulator_digest: ${{ steps.simulator.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The tag points back to the source commit.
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dummy-exchange-api:sha-${{ github.sha }}
          # Include how the image was built and what software it contains.
          provenance: mode=max
          sbom: true
      - id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dummy-exchange-worker:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - id: simulator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/simulator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dummy-exchange-simulator:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

  # Record the new images in Git. Argo CD handles the Kubernetes rollout.
  # This job doesn't wait for that rollout to finish; check Argo CD afterwards.
  promote-dev:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: mikefarah/yq@v4
      - name: Record the immutable image digests
        env:
          IMAGE_REGISTRY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
          API_DIGEST: ${{ needs.publish-images.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.publish-images.outputs.worker_digest }}
          SIMULATOR_DIGEST: ${{ needs.publish-images.outputs.simulator_digest }}
        run: |
          # Digests pin the exact images, even if someone changes a tag later.
          for chart in exchange-api exchange-worker exchange; do
            yq -i '.imageRegistry = strenv(IMAGE_REGISTRY)' "deploy/helm/$chart/values-dev.yaml"
          done
          yq -i '.image.digest = strenv(API_DIGEST)' deploy/helm/exchange-api/values-dev.yaml
          yq -i '.image.digest = strenv(WORKER_DIGEST)' deploy/helm/exchange-worker/values-dev.yaml
          yq -i '.image.digest = strenv(SIMULATOR_DIGEST)' deploy/helm/exchange/values-dev.yaml
      - name: Commit the desired development release
        run: |
          git config user.name 'dummy-exchange deployment bot'
          git config user.email 'deployment-bot@users.noreply.github.com'
          git add deploy/helm/exchange-api/values-dev.yaml deploy/helm/exchange-worker/values-dev.yaml deploy/helm/exchange/values-dev.yaml
          # Commit only if the desired image versions have changed.
          git diff --cached --quiet || git commit -m 'deploy(dev): promote ${{ github.sha }}'
          git push
