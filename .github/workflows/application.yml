# Check the apps and Helm chart. Pull requests only test and build images.
# On main, publish the images and update their versions in Git.
# Argo CD then picks up the change and deploys it to dev.
name: Test, publish, and deploy applications

# Check pull requests. Publish images and update dev only from main.
on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - deploy/helm/**
      - .dockerignore
      - compose.yaml
      - scripts/check-helm.py
      - scripts/build-frontend.py
      - scripts/wait-pages-project.py
      - scripts/verify-exchange.py
      - scripts/verify-kafka.py
      - scripts/verify-market-generator.py
      - scripts/reset-bots.sql
      - compose.kafka.yaml
      - scripts/requirements-helm.txt
      - .github/workflows/security.yml
      - .trivyignore.yaml
      - scripts/install-security-tools.py
      - scripts/check-workflow-security.py
      - .github/workflows/application.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - deploy/helm/**
      - .dockerignore
      - compose.yaml
      - scripts/check-helm.py
      - scripts/build-frontend.py
      - scripts/wait-pages-project.py
      - scripts/verify-exchange.py
      - scripts/verify-kafka.py
      - scripts/verify-market-generator.py
      - scripts/reset-bots.sql
      - compose.kafka.yaml
      - scripts/requirements-helm.txt
      # The bot updates this file after publishing. Don't start another build.
      - '!deploy/helm/exchange-api/values-dev.yaml'
      - '!deploy/helm/exchange-worker/values-dev.yaml'
      - '!deploy/helm/exchange/values-dev.yaml'
      - .github/workflows/security.yml
      - .trivyignore.yaml
      - scripts/install-security-tools.py
      - scripts/check-workflow-security.py
      - .github/workflows/application.yml
  workflow_dispatch: # Also lets us start a run from the Actions tab.

# Jobs can read the repo. Only the promotion job below can write to it.
permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  # Keep the latest run for each branch or pull request.
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml

  # Produce a downloadable static site independently of the API image.
  frontend-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290 # 1.98.1
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: python3 scripts/build-frontend.py --api-origin https://api.garyrizzo.dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exchange-frontend-static
          path: target/frontend-static/
          if-no-files-found: error

  deploy-frontend:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend-artifact, test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '81ff770ff712c1f376f115fbacc80f5e'
      PAGES_PROJECT: dummy-exchange-dev-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exchange-frontend-static
          path: target/frontend-static/
      - name: Wait for the Terraform-managed Pages project
        run: python3 scripts/wait-pages-project.py
      - name: Check that the frontend release still matches main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git diff --exit-code "$SOURCE_SHA" origin/main -- Cargo.toml Cargo.lock crates/frontend scripts/build-frontend.py .github/workflows/application.yml
      - name: Deploy the static frontend
        run: npx --yes wrangler@4.147.0 pages deploy target/frontend-static --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

  # Check the Rust code and Helm chart before building images.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290 # 1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.22.0
      - run: cargo fmt --all -- --check
      - name: Ensure native build dependencies are installed
        run: |
          if command -v cmake >/dev/null && dpkg-query -W -f='${Status}' libcurl4-openssl-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo 'Native build dependencies are already installed.'
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake libcurl4-openssl-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p exchange-frontend --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify orders, account ownership, and public API protections
        run: |
          docker run -d --name exchange-verification-postgres -p 127.0.0.1:25432:5432 -e POSTGRES_PASSWORD=test-only-private-password -e POSTGRES_DB=dummy_exchange postgres:18.6-alpine
          timeout 60s bash -c 'until docker exec exchange-verification-postgres pg_isready -U postgres; do sleep 1; done'
          cargo build --workspace --locked
          PGHOST=127.0.0.1 PGPORT=25432 PGUSER=postgres PGDATABASE=dummy_exchange PGPASSWORD=test-only-private-password PGSSLMODE=disable target/debug/exchange-api migrate
          python scripts/verify-exchange.py
          python scripts/verify-market-generator.py
          docker compose -p exchange-kafka-verification -f compose.yaml -f compose.kafka.yaml up -d kafka1 kafka2 kafka3 kafka-init
          python scripts/verify-kafka.py
      - name: Clean up disposable integration services
        if: always()
        run: |
          docker compose -p exchange-kafka-verification -f compose.yaml -f compose.kafka.yaml down -v
          docker rm -f exchange-verification-postgres || true
      - run: cargo build --workspace --release --locked
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-helm.txt
      - name: Install Kubernetes manifest validator
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          printf '%s  %s\n' '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883' /tmp/kubeconform.tar.gz | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: python scripts/check-helm.py

  # For pull requests, build all three images in parallel without uploading them.
  verify-images:
    if: github.event_name == 'pull_request'
    needs: [test, security]
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: crates/api/Dockerfile
          - dockerfile: crates/worker/Dockerfile
          - dockerfile: crates/simulator/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false

  # Build each architecture on its native runner, then combine immutable digests.
  publish-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, security]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, simulator]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: crates/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dummy-exchange-${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Install verified image scanner
        run: python3 scripts/install-security-tools.py --directory "$RUNNER_TEMP/security-tools"
      - name: Gate the exact published architecture digest
        env:
          IMAGE_REF: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dummy-exchange-${{ matrix.image }}@${{ steps.image.outputs.digest }}
        run: '"$RUNNER_TEMP/security-tools/trivy" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml "$IMAGE_REF"'
      - name: Record architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DIGEST_FILE: ${{ matrix.image }}-${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digests
          printf '%s' "$IMAGE_DIGEST" > "/tmp/digests/$DIGEST_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish-manifests:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      api_digest: ${{ steps.manifests.outputs.api_digest }}
      worker_digest: ${{ steps.manifests.outputs.worker_digest }}
      simulator_digest: ${{ steps.manifests.outputs.simulator_digest }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - id: manifests
        name: Publish multi-platform images
        env:
          IMAGE_REGISTRY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for image in api worker simulator; do
            repository="$IMAGE_REGISTRY/dummy-exchange-$image"
            amd64=$(cat "/tmp/digests/$image-amd64")
            arm64=$(cat "/tmp/digests/$image-arm64")
            tag="$repository:sha-$SOURCE_SHA"
            docker buildx imagetools create --tag "$tag" "$repository@$amd64" "$repository@$arm64"
            digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" | jq -r '.digest')
            test "$digest" != null
            echo "${image}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

  # Record the new images in Git. Argo CD handles the Kubernetes rollout.
  # This job doesn't wait for that rollout to finish; check Argo CD afterwards.
  promote-dev:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4
      - name: Check that the built release still matches main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          # Allow documentation changes, but never promote old images against
          # newer source, migrations, chart settings, or build configuration.
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- \
            Cargo.toml Cargo.lock crates migrations deploy/helm .dockerignore \
            compose.yaml compose.kafka.yaml scripts .github/workflows/application.yml .github/workflows/security.yml .trivyignore.yaml; then
            echo '::error::Release inputs changed after this build. Run the application workflow on current main.'
            exit 1
          fi
          git checkout -B main origin/main
      - name: Record the immutable image digests
        env:
          IMAGE_REGISTRY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
          API_DIGEST: ${{ needs.publish-manifests.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.publish-manifests.outputs.worker_digest }}
          SIMULATOR_DIGEST: ${{ needs.publish-manifests.outputs.simulator_digest }}
        run: |
          # Digests pin the exact images, even if someone changes a tag later.
          for chart in exchange-api exchange-worker exchange; do
            yq -i '.imageRegistry = strenv(IMAGE_REGISTRY)' "deploy/helm/$chart/values-dev.yaml"
          done
          yq -i '.image.digest = strenv(API_DIGEST)' deploy/helm/exchange-api/values-dev.yaml
          yq -i '.image.digest = strenv(WORKER_DIGEST)' deploy/helm/exchange-worker/values-dev.yaml
          yq -i '.image.digest = strenv(SIMULATOR_DIGEST)' deploy/helm/exchange/values-dev.yaml
          yq -i '.traders.enabled = true' deploy/helm/exchange/values-dev.yaml
          yq -i '.kafka.enabled = true | .traders.autoscaling.enabled = true' deploy/helm/exchange/values-dev.yaml
          yq -i '.kafka.enabled = true | .autoscaling.enabled = true' deploy/helm/exchange-worker/values-dev.yaml
      - name: Commit the desired development release
        run: |
          git config user.name 'dummy-exchange deployment bot'
          git config user.email 'deployment-bot@users.noreply.github.com'
          git add deploy/helm/exchange-api/values-dev.yaml deploy/helm/exchange-worker/values-dev.yaml deploy/helm/exchange/values-dev.yaml
          # Commit only if the desired image versions have changed.
          git diff --cached --quiet || git commit -m 'deploy(dev): promote ${{ github.sha }}'
          git push
