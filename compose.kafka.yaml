# docker compose -f compose.yaml -f compose.kafka.yaml up --build
# Three dual-role KRaft nodes. No ZooKeeper, no public deployment listener.
x-kafka-env: &kafka-env
  CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
x-kafka-service: &kafka-service
  image: registry-1.docker.io/apache/kafka:4.3.1
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
    interval: 10s
    timeout: 10s
    retries: 30
services:
  kafka1:
    <<: *kafka-service
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,HOST://localhost:19092
    ports: ['127.0.0.1:19092:19092']
    volumes: [kafka1_data:/var/lib/kafka/data]
  kafka2:
    <<: *kafka-service
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,HOST://localhost:19093
    ports: ['127.0.0.1:19093:19092']
    volumes: [kafka2_data:/var/lib/kafka/data]
  kafka3:
    <<: *kafka-service
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,HOST://localhost:19094
    ports: ['127.0.0.1:19094:19092']
    volumes: [kafka3_data:/var/lib/kafka/data]
  kafka-init:
    image: registry-1.docker.io/apache/kafka:4.3.1
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, 'kafka1:9092', --create, --if-not-exists, --topic, exchange.order-commands, --partitions, '12', --replication-factor, '3', --config, min.insync.replicas=2]
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
  worker:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  worker2:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  trader:
    build: {context: ., dockerfile: crates/simulator/Dockerfile}
    command: [trader]
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      TRADER_ID: local-trader-0
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      RUST_LOG: info
    depends_on:
      api: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}
volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
