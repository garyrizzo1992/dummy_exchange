services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dummy_exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dummy_exchange"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    build:
      context: ./redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-change-before-any-shared-use
      API_BIND: 0.0.0.0:3000
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: crates/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  worker2:
    build:
      context: .
      dockerfile: crates/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: crates/simulator/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      SIMULATION_SEED: 42
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
