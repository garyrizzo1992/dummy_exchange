services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dummy_exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dummy_exchange"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    build:
      context: ./redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-change-before-any-shared-use
      API_BIND: 0.0.0.0:3000
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: crates/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  worker2:
    build:
      context: .
      dockerfile: crates/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: crates/simulator/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/dummy_exchange
      SIMULATION_SEED: 42
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:password@postgres:5432/dummy_exchange?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0@sha256:2c8c55c63ce4d915389f03d337b8acef56aaaca9fab8728291287e612d4d6398
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - worker
      - simulator
      - postgres-exporter
      - redis-exporter

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
